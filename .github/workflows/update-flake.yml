name: Update Flake Lock

# Daily `nix flake update` proposed as a PR on the fixed branch `flake-update`,
# validated by `nix flake check`, and auto-merged ~1 week after it was opened.
# Only `flake.lock` is ever merged.
#
# `master` is protected (PR + 1 approval required). A bot cannot approve its own
# PR, so the scheduled merge bypasses the approval with `gh pr merge --admin`;
# the real safety gate is the green `nix flake check` + the 7-day soak, both
# enforced in the merge step below.
#
# All git/gh auth uses the fine-grained PAT `FLAKE_BOT_TOKEN`
# (repo Contents: RW + Pull requests: RW). The PAT's user must be in the
# branch-protection bypass allowlist for `--admin` to succeed.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths: ["flake.lock"]

concurrency:
  # Per-PR for checks; a single shared "maintenance" lane for schedule/dispatch
  # so merge/propose never run concurrently with themselves.
  group: flake-update-${{ github.event.pull_request.number || 'maintenance' }}
  cancel-in-progress: false

env:
  FLAKE_BRANCH: flake-update

jobs:
  # Validation gate: runs on every PR that changes flake.lock (incl. the bot's).
  # Publishes a status check named "check" that the merge step requires.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate flake
        # Narrow this if it is too heavy on the runner, e.g.
        #   nix flake check --no-build
        # or build only the system you ship:
        #   nix build .#nixosConfigurations.<host>.config.system.build.toplevel
        run: nix flake check

  # Merge the open flake-update PR once it is >7 days old, its check is green,
  # and it touches only flake.lock. Runs first so `propose` sees a fresh master.
  merge:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.FLAKE_BOT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge aged flake.lock PR (>7d, green check, flake.lock only)
        env:
          GH_TOKEN: ${{ secrets.FLAKE_BOT_TOKEN }}
        run: |
          set -euo pipefail

          CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          PR=$(gh pr list \
                 --state open \
                 --head "$FLAKE_BRANCH" \
                 --json number,createdAt \
                 --jq "[ .[] | select(.createdAt < \"$CUTOFF\") ] | .[0].number // empty")

          if [ -z "$PR" ]; then
            echo "No flake-update PR older than 7 days. Nothing to merge."
            exit 0
          fi

          # Gate 1: validation must be green.
          CONCL=$(gh pr view "$PR" --json statusCheckRollup \
                    --jq '[.statusCheckRollup[]? | select(.name? == "check")] | last | .conclusion // "PENDING"')
          if [ "$CONCL" != "SUCCESS" ]; then
            echo "flake check not green for PR #$PR (conclusion=$CONCL); not merging."
            exit 0
          fi

          # Gate 2: refuse to merge anything that touches more than flake.lock.
          FILES=$(gh pr view "$PR" --json files --jq '[.files[].path] | join(",")')
          if [ "$FILES" != "flake.lock" ]; then
            echo "PR #$PR touches more than flake.lock ($FILES); aborting."
            exit 1
          fi

          echo "Merging PR #$PR (check=green, age>7d, flake.lock only)"
          gh pr merge "$PR" \
            --squash \
            --delete-branch \
            --admin \
            --subject "chore: update flake.lock"

  # Open the next PR if the lock changed and no flake-update PR is currently open.
  propose:
    if: github.event_name != 'pull_request'
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.FLAKE_BOT_TOKEN }}

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.FLAKE_BOT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update flake.lock
        run: nix flake update

      - name: Open PR if lock changed and none open
        env:
          GH_TOKEN: ${{ secrets.FLAKE_BOT_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet flake.lock; then
            echo "flake.lock unchanged. Nothing to propose."
            exit 0
          fi

          # One PR at a time: if one is already open, leave it to age toward merge.
          EXISTING=$(gh pr list \
                       --state open \
                       --head "$FLAKE_BRANCH" \
                       --json number \
                       --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open for $FLAKE_BRANCH; skipping."
            exit 0
          fi

          # Producer guarantee: only flake.lock can ever enter the branch.
          git checkout -B "$FLAKE_BRANCH"
          git add flake.lock
          git commit -m "chore: update flake.lock"
          git push --force origin "$FLAKE_BRANCH"

          gh label create "dependencies" \
            --description "Pull requests that update a dependency file" \
            --color "0366d6" || true
          gh label create "automated" \
            --description "Automated pull requests" \
            --color "34d058" || true

          gh pr create \
            --base master \
            --head "$FLAKE_BRANCH" \
            --title "Automatic flake.lock update" \
            --body "Automated \`nix flake update\`, validated by \`nix flake check\`. Auto-merged ~1 week after opening once the check is green (only \`flake.lock\` is merged). Close this PR to reject the update." \
            --label "dependencies,automated"
