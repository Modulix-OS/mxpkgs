name: Update Flake Lock

# Daily `nix flake update` committed straight to `testing` once `nix flake check`
# is green, then `testing` is promoted to `main` through a PR that auto-merges
# 48h after it was opened. `testing` is the soak branch: it carries the lock bump
# *and* any other change, and `main` trails it by 48h.
#
# Promotion is a fast-forward push, never a squash: a squash would create a commit
# on `main` that does not exist on `testing`, `main` would stop being an ancestor of
# `testing`, and every later cycle would abort on the topology gate below.
#
# All git/gh auth uses the fine-grained PAT `FLAKE_BOT_TOKEN`
# (repo Contents: RW + Pull requests: RW). The PAT's user must be in the
# branch-protection bypass allowlist of `main` for the fast-forward to succeed.

on:
  schedule:
    # 2am UTC. GitHub cron has no DST handling, so this is 3am Paris in winter
    # and 4am Paris in summer.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force_promote:
        description: "Promote testing -> main without waiting for the 48h soak"
        type: boolean
        default: false
  pull_request:
    branches: [main]

concurrency:
  # Per-PR for checks; a single shared "maintenance" lane for schedule/dispatch
  # so promote/update never run concurrently with themselves.
  group: flake-update-${{ github.event.pull_request.number || 'maintenance' }}
  cancel-in-progress: false

env:
  SRC_BRANCH: testing
  DST_BRANCH: main
  SOAK_HOURS: 48

jobs:
  # Validation gate: runs on every PR targeting `main`, which in practice is the
  # bot's `testing` -> `main` promotion PR. Publishes a status check named "check"
  # that the promote step requires by name.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate flake
        # Must stay a *building* check: `checks.<system>.gnome-shell-app-folder-order-patch`
        # is what proves the gnome-shell patch in
        # modulixos/desktop/gnome/patches/ still applies to the bumped nixpkgs.
        # A `--no-build` run only evaluates, so a patch that stopped applying
        # would pass the gate and get auto-merged, breaking every rebuild.
        run: nix flake check

  # Fast-forward `main` onto `testing` once the promotion PR is older than the
  # soak window and its check is green. Runs first so `update` sees a fresh `main`.
  promote:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DST_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.FLAKE_BOT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch both branches
        # actions/checkout only guarantees the checked-out ref; the gates below
        # compare remote-tracking refs, so fetch them explicitly.
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/$SRC_BRANCH:refs/remotes/origin/$SRC_BRANCH" \
            "+refs/heads/$DST_BRANCH:refs/remotes/origin/$DST_BRANCH"

      - name: Promote testing -> main (aged PR, green check, fast-forward only)
        env:
          GH_TOKEN: ${{ secrets.FLAKE_BOT_TOKEN }}
          FORCE_PROMOTE: ${{ inputs.force_promote }}
        run: |
          set -euo pipefail

          if [ "${FORCE_PROMOTE:-false}" = "true" ]; then
            echo "force_promote requested: skipping the ${SOAK_HOURS}h age gate."
            PR=$(gh pr list \
                   --state open \
                   --head "$SRC_BRANCH" \
                   --base "$DST_BRANCH" \
                   --json number \
                   --jq '.[0].number // empty')
          else
            CUTOFF=$(date -u -d "$SOAK_HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)
            PR=$(gh pr list \
                   --state open \
                   --head "$SRC_BRANCH" \
                   --base "$DST_BRANCH" \
                   --json number,createdAt \
                   --jq "[ .[] | select(.createdAt < \"$CUTOFF\") ] | .[0].number // empty")
          fi

          if [ -z "$PR" ]; then
            echo "No $SRC_BRANCH -> $DST_BRANCH PR eligible for promotion. Nothing to do."
            exit 0
          fi

          # Gate 1: validation must be green.
          CONCL=$(gh pr view "$PR" --json statusCheckRollup \
                    --jq '[.statusCheckRollup[]? | select(.name? == "check")] | last | .conclusion // "PENDING"')
          if [ "$CONCL" != "SUCCESS" ]; then
            echo "flake check not green for PR #$PR (conclusion=$CONCL); not promoting."
            exit 0
          fi

          # Gate 2: the promotion must be a fast-forward. If `main` is not an
          # ancestor of `testing`, the branches diverged and a human has to sort
          # it out -- merging here would silently rewrite the 48h-lead invariant.
          if ! git merge-base --is-ancestor "origin/$DST_BRANCH" "origin/$SRC_BRANCH"; then
            echo "origin/$DST_BRANCH is not an ancestor of origin/$SRC_BRANCH: branches diverged."
            echo "Refusing to promote. Reconcile the branches manually."
            exit 1
          fi

          if [ "$(git rev-parse "origin/$DST_BRANCH")" = "$(git rev-parse "origin/$SRC_BRANCH")" ]; then
            echo "origin/$DST_BRANCH already equals origin/$SRC_BRANCH; nothing to promote."
            exit 0
          fi

          echo "Fast-forwarding $DST_BRANCH to $SRC_BRANCH (PR #$PR, check=green)"
          git push origin "origin/$SRC_BRANCH:refs/heads/$DST_BRANCH"
          # GitHub closes the PR as "merged" on its own once the head commits
          # become reachable from the base branch.

  # Bump flake.lock on `testing`, then open the promotion PR if one is due.
  update:
    if: github.event_name != 'pull_request'
    needs: promote
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout testing
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SRC_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.FLAKE_BOT_TOKEN }}

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.FLAKE_BOT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update flake.lock
        run: nix flake update

      - name: Validate the bumped flake
        # Blocking on purpose: a broken lock must never reach `testing`. Failing
        # here leaves `testing` untouched and surfaces as a red workflow run.
        run: nix flake check

      - name: Commit the bump to testing
        run: |
          set -euo pipefail

          if git diff --quiet flake.lock; then
            echo "flake.lock unchanged. Nothing to commit."
            exit 0
          fi

          git add flake.lock
          git commit -m "chore: update flake.lock"

          # `testing` is a live branch: never force-push it. Rebase onto whatever
          # landed while `nix flake check` was running, then retry.
          for attempt in 1 2 3; do
            if git push origin "HEAD:$SRC_BRANCH"; then
              echo "Pushed flake.lock bump to $SRC_BRANCH (attempt $attempt)."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; rebasing onto origin/$SRC_BRANCH."
            git pull --rebase origin "$SRC_BRANCH"
          done

          echo "Could not push the flake.lock bump to $SRC_BRANCH after 3 attempts."
          exit 1

      - name: Open the promotion PR if one is due
        env:
          GH_TOKEN: ${{ secrets.FLAKE_BOT_TOKEN }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin \\
            "+refs/heads/$SRC_BRANCH:refs/remotes/origin/$SRC_BRANCH" \\
            "+refs/heads/$DST_BRANCH:refs/remotes/origin/$DST_BRANCH"

          AHEAD=$(git rev-list --count "origin/$DST_BRANCH..origin/$SRC_BRANCH")
          if [ "$AHEAD" -eq 0 ]; then
            echo "origin/$SRC_BRANCH is not ahead of origin/$DST_BRANCH. Nothing to promote."
            exit 0
          fi

          # One promotion PR at a time: an open one keeps aging toward its merge
          # and picks up every later push to `testing` on its own.
          EXISTING=$(gh pr list \
                       --state open \
                       --head "$SRC_BRANCH" \
                       --base "$DST_BRANCH" \
                       --json number \
                       --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open for $SRC_BRANCH -> $DST_BRANCH; skipping."
            exit 0
          fi

          gh label create "dependencies" \
            --description "Pull requests that update a dependency file" \
            --color "0366d6" || true
          gh label create "automated" \
            --description "Automated pull requests" \
            --color "34d058" || true

          # Built with printf rather than a heredoc: a heredoc terminator cannot
          # be indented, and an unindented line would close this YAML block scalar.
          printf '%s\n' \
            "Automated promotion of \`$SRC_BRANCH\` onto \`$DST_BRANCH\`." \
            "" \
            "\`$SRC_BRANCH\` is the soak branch and runs ${SOAK_HOURS}h ahead of \`$DST_BRANCH\`." \
            "This PR carries everything \`$SRC_BRANCH\` accumulated -- the daily" \
            "\`flake.lock\` bump and any other change -- and keeps picking up later" \
            "pushes to \`$SRC_BRANCH\`." \
            "" \
            "It is fast-forwarded onto \`$DST_BRANCH\` ${SOAK_HOURS}h after it was opened," \
            "provided the \`check\` job is green. Merge it earlier by hand, or re-run the" \
            "workflow with \`force_promote\`, to promote right away." \
            "" \
            "To reject an update:" \
            "" \
            "- push a revert onto \`$SRC_BRANCH\` -- the PR follows the branch head, so the" \
            "  revert neutralises the bad change without closing the PR, or" \
            "- close this PR to cancel the promotion entirely." \
            > "$RUNNER_TEMP/pr-body.md"

          gh pr create \
            --base "$DST_BRANCH" \
            --head "$SRC_BRANCH" \
            --title "Promote testing to main" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --label "dependencies,automated"
